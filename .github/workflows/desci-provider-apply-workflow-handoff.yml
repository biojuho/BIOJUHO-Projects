name: DeSci Provider Apply Workflow Handoff

run-name: DeSci provider apply workflow handoff by @${{ github.actor }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

on:
  workflow_dispatch: {}

jobs:
  provider-apply-workflow-handoff:
    name: Provider Apply Workflow Handoff
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Bootstrap legacy paths
        run: python3 bootstrap_legacy_paths.py

      - uses: ./.github/actions/setup-python-uv
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: uv sync --all-packages

      - name: Generate provider apply workflow handoff
        id: provider-apply-workflow
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        shell: pwsh
        run: |
          uv run python apps/desci-platform/scripts/external_release_gate.py `
            --json-out var/external-release-gate-provider-workflow-machine.json
          $externalExitCode = $LASTEXITCODE
          "external_exit_code=$externalExitCode" >> $env:GITHUB_OUTPUT
          if ($externalExitCode -ne 0) {
            Write-Warning "External release gate exited with $externalExitCode. The handoff bundle will still be generated."
          }

          uv run python apps/desci-platform/scripts/external_gate_handoff.py `
            --external-gate-json var/external-release-gate-provider-workflow-machine.json `
            --json-out var/external-gate-handoff-provider-workflow-machine.json `
            --markdown-out var/external-gate-handoff-provider-workflow-machine.md `
            --provider-template-dir var/external-gate-provider-workflow-machine `
            --provider-template-index-out var/external-gate-provider-workflow-index-machine.json `
            --provider-apply-plan-out var/external-gate-provider-workflow-machine.json `
            --provider-apply-plan-markdown-out var/external-gate-provider-workflow-machine.md
          $handoffExitCode = $LASTEXITCODE
          "handoff_exit_code=$handoffExitCode" >> $env:GITHUB_OUTPUT
          if ($handoffExitCode -ne 0) {
            Write-Warning "Provider handoff generation exited with $handoffExitCode. Artifacts will still be uploaded before the job fails."
          }

          uv run python apps/desci-platform/scripts/external_gate_handoff.py `
            --record-provider-apply-results-from-plan var/external-gate-provider-workflow-machine.json `
            --json-out var/external-gate-provider-workflow-machine-results.json
          $resultsExitCode = $LASTEXITCODE
          "results_exit_code=$resultsExitCode" >> $env:GITHUB_OUTPUT
          if ($resultsExitCode -ne 0) {
            Write-Warning "Provider apply results recorder exited with $resultsExitCode. This is expected while provider values remain unapplied."
          }

          uv run python apps/desci-platform/scripts/external_gate_handoff.py `
            --verify-provider-apply-workflow var/external-gate-provider-workflow-machine.json `
            --require-promotion-go `
            --json-out var/external-gate-provider-workflow-machine-verify.json `
            --markdown-out var/external-gate-provider-workflow-machine-verify.md `
            --github-step-summary `
            --github-annotations `
            --github-output
          $verifyExitCode = $LASTEXITCODE
          "verify_exit_code=$verifyExitCode" >> $env:GITHUB_OUTPUT
          if ($verifyExitCode -ne 0) {
            Write-Warning "Provider apply workflow verifier exited with $verifyExitCode. Artifacts will still be uploaded before the job fails."
          }

          exit 0

      - name: Write provider apply workflow artifact index
        if: always()
        env:
          EXTERNAL_RELEASE_GATE_EXIT_CODE: ${{ steps.provider-apply-workflow.outputs.external_exit_code }}
          PROVIDER_HANDOFF_EXIT_CODE: ${{ steps.provider-apply-workflow.outputs.handoff_exit_code }}
          PROVIDER_APPLY_RESULTS_EXIT_CODE: ${{ steps.provider-apply-workflow.outputs.results_exit_code }}
          PROVIDER_WORKFLOW_VERIFY_EXIT_CODE: ${{ steps.provider-apply-workflow.outputs.verify_exit_code }}
        run: |
          uv run python ops/scripts/write_desci_provider_workflow_artifact_index.py \
            --json-out var/desci-provider-workflow-artifact-index-machine.json \
            --markdown-summary-out var/desci-provider-workflow-artifact-index-summary.md \
            --append-github-step-summary

      - name: Verify provider apply workflow artifact bundle
        if: always()
        run: |
          uv run python ops/scripts/verify_desci_provider_workflow_artifact_bundle.py \
            --index var/desci-provider-workflow-artifact-index-machine.json \
            --artifact-root . \
            --json-out var/desci-provider-workflow-artifact-bundle-verify.json \
            --markdown-out var/desci-provider-workflow-artifact-bundle-verify.md \
            --append-github-step-summary

      - name: Attest provider apply workflow evidence
        if: always()
        uses: actions/attest@f6bf1532d7d6793fce74eac584813a8eee607999 # v4
        with:
          subject-path: |
            var/desci-provider-workflow-artifact-index-machine.json
            var/desci-provider-workflow-artifact-index-summary.md
            var/desci-provider-workflow-artifact-bundle-verify.json
            var/desci-provider-workflow-artifact-bundle-verify.md
            var/external-release-gate-provider-workflow-machine.json
            var/external-gate-handoff-provider-workflow-machine.json
            var/external-gate-handoff-provider-workflow-machine.md
            var/external-gate-provider-workflow-index-machine.json
            var/external-gate-provider-workflow-machine.json
            var/external-gate-provider-workflow-machine.md
            var/external-gate-provider-workflow-machine-results.json
            var/external-gate-provider-workflow-machine-verify.json
            var/external-gate-provider-workflow-machine-verify.md

      - name: Upload provider apply workflow artifacts
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: provider-apply-workflow-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            var/desci-provider-workflow-artifact-index-machine.json
            var/desci-provider-workflow-artifact-index-summary.md
            var/desci-provider-workflow-artifact-bundle-verify.json
            var/desci-provider-workflow-artifact-bundle-verify.md
            var/external-release-gate-provider-workflow-machine.json
            var/external-gate-handoff-provider-workflow-machine.json
            var/external-gate-handoff-provider-workflow-machine.md
            var/external-gate-provider-workflow-index-machine.json
            var/external-gate-provider-workflow-machine.json
            var/external-gate-provider-workflow-machine.md
            var/external-gate-provider-workflow-machine-results.json
            var/external-gate-provider-workflow-machine-verify.json
            var/external-gate-provider-workflow-machine-verify.md
            var/external-gate-provider-workflow-machine/**
          if-no-files-found: error
          retention-days: 30

      - name: Fail closed on provider apply workflow blockers
        if: always()
        shell: pwsh
        run: |
          $externalExitCode = "${{ steps.provider-apply-workflow.outputs.external_exit_code }}"
          $handoffExitCode = "${{ steps.provider-apply-workflow.outputs.handoff_exit_code }}"
          $resultsExitCode = "${{ steps.provider-apply-workflow.outputs.results_exit_code }}"
          $verifyExitCode = "${{ steps.provider-apply-workflow.outputs.verify_exit_code }}"
          $workflowOk = "${{ steps.provider-apply-workflow.outputs.provider_apply_workflow_ok }}"
          $failed = $false

          foreach ($entry in @(
            @{ Name = "external release gate"; Code = $externalExitCode },
            @{ Name = "provider handoff"; Code = $handoffExitCode },
            @{ Name = "provider apply results"; Code = $resultsExitCode },
            @{ Name = "provider apply workflow verifier"; Code = $verifyExitCode }
          )) {
            if ([string]::IsNullOrWhiteSpace($entry.Code)) {
              Write-Error "$($entry.Name) did not report an exit code."
              $failed = $true
            } elseif ([int]$entry.Code -ne 0) {
              Write-Error "$($entry.Name) failed with exit code $($entry.Code)."
              $failed = $true
            }
          }

          if ($workflowOk -ne "true") {
            Write-Error "Provider apply workflow is not verified as go. Inspect var/external-gate-provider-workflow-machine-verify.json."
            $failed = $true
          }

          if ($failed) {
            exit 1
          }

  provider-apply-workflow-artifact-post-download:
    name: Provider Apply Workflow Artifact Post-Download Verification
    runs-on: ubuntu-latest
    needs: provider-apply-workflow-handoff
    if: always()
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Download provider apply workflow artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: provider-apply-workflow-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: var/provider-workflow-downloaded-artifact

      - name: Verify downloaded provider apply workflow artifact bundle
        run: |
          python3 ops/scripts/verify_desci_provider_workflow_artifact_bundle.py \
            --index var/provider-workflow-downloaded-artifact/desci-provider-workflow-artifact-index-machine.json \
            --artifact-root var/provider-workflow-downloaded-artifact \
            --json-out var/provider-workflow-downloaded-artifact-bundle-verify.json \
            --markdown-out var/provider-workflow-downloaded-artifact-bundle-verify.md \
            --append-github-step-summary

      - name: Verify downloaded provider apply workflow attestations
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -uo pipefail
          output_dir="var/provider-workflow-attestation-verify"
          mkdir -p "$output_dir"
          summary_path="$output_dir/summary.md"
          subjects=(
            "var/provider-workflow-downloaded-artifact/desci-provider-workflow-artifact-index-machine.json"
            "var/provider-workflow-downloaded-artifact/desci-provider-workflow-artifact-bundle-verify.json"
            "var/provider-workflow-downloaded-artifact/external-gate-provider-workflow-machine-results.json"
            "var/provider-workflow-downloaded-artifact/external-gate-provider-workflow-machine-verify.md"
          )

          {
            echo "## DeSci Provider Workflow Attestation Verification"
            echo
            echo "| Subject | Verified | Evidence |"
            echo "|---|---|---|"
          } > "$summary_path"

          failures=0
          for subject in "${subjects[@]}"; do
            subject_name="$(basename "$subject")"
            json_out="$output_dir/${subject_name}.json"
            stderr_out="$output_dir/${subject_name}.stderr.txt"
            verified=false
            for attempt in 1 2 3; do
              if gh attestation verify "$subject" --repo "${GITHUB_REPOSITORY}" --format json > "$json_out" 2> "$stderr_out"; then
                verified=true
                break
              fi
              sleep $((attempt * 5))
            done
            if [ "$verified" = true ]; then
              echo "| \`$subject\` | yes | \`$json_out\` |" >> "$summary_path"
            else
              failures=$((failures + 1))
              echo "| \`$subject\` | no | \`$stderr_out\` |" >> "$summary_path"
            fi
          done

          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            cat "$summary_path" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$failures" -ne 0 ]; then
            exit 1
          fi

      - name: Upload downloaded provider apply workflow verification
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: provider-apply-workflow-post-download-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            var/provider-workflow-downloaded-artifact-bundle-verify.json
            var/provider-workflow-downloaded-artifact-bundle-verify.md
            var/provider-workflow-attestation-verify/**
          if-no-files-found: error
          retention-days: 30
